<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Utdelningsrutt</title>
<meta name="apple-mobile-web-app-title" content="Utdelning">
<meta name="theme-color" content="#1f5f4a">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root{
  --bg:#f4f2ee; --card:#ffffff; --ink:#1d1b18; --muted:#6f6a62; --line:#e3dfd8;
  --accent:#1f5f4a; --accent-ink:#ffffff; --accent-soft:#e3efe9;
  --warn:#b4541c; --warn-soft:#fbeadf; --bad:#a3262a; --bad-soft:#f8e1e1;
  --info-soft:#f6f0dc; --code:#24211d;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141412; --card:#1f1e1b; --ink:#f1eee8; --muted:#a39d93; --line:#33312c;
    --accent:#4fb08c; --accent-ink:#0d1f18; --accent-soft:#1d332a;
    --warn:#f0965a; --warn-soft:#3a2618; --bad:#f07a7d; --bad-soft:#3a1c1d; --info-soft:#2e2a1d; --code:#f1eee8; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 110px) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{padding:16px 0 8px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.sync{font-size:12px;color:var(--muted);margin-top:4px}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stats{display:flex;gap:14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink)}
nav.tabs{display:flex;gap:6px;margin:14px 0 10px;background:var(--line);padding:4px;border-radius:12px}
nav.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
nav.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toolbar{display:flex;gap:8px;align-items:center;margin:4px 0 12px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:99px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn.small{padding:7px 11px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.card.done{opacity:.55}
.card.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card-head{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent}
.ord{min-width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.card.done .ord{background:var(--accent);color:var(--accent-ink)}
.addr{font-weight:700;font-size:17px;line-height:1.25}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.give{font-weight:700;color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font:600 15px/1 ui-monospace,"SF Mono",Menlo,monospace;background:var(--bg);border:1px solid var(--line);color:var(--code);padding:7px 9px;border-radius:8px}
.chip small{font:500 11px/1 -apple-system,sans-serif;color:var(--muted);margin-right:5px;text-transform:uppercase;letter-spacing:.04em}
.chip.miss{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.plain{font-family:inherit;font-size:13px}
.flag{display:inline-block;font-size:12px;font-weight:700;padding:3px 7px;border-radius:6px;margin-top:6px;margin-right:4px}
.flag.bad{background:var(--bad-soft);color:var(--bad)}
.flag.warn{background:var(--warn-soft);color:var(--warn)}
.flag.ok{background:var(--accent-soft);color:var(--accent)}
.body{padding:0 14px 14px}
.note{font-size:14px;background:var(--info-soft);border-radius:10px;padding:9px 11px;margin:8px 0}
.note.plain{background:var(--bg)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.stepper{display:flex;align-items:center;gap:10px;margin-top:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:600}
.stepper output{font-size:22px;font-weight:700;min-width:36px;text-align:center}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opt{border:1px solid var(--line);background:var(--bg);padding:9px 12px;border-radius:10px;font-size:14px;font-weight:600}
.opt[aria-pressed=true]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.good[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}
.skipped{border:1px dashed var(--line);border-radius:var(--r);padding:4px 14px 10px;margin-top:16px}
.skipped summary{padding:10px 0;font-weight:600;color:var(--muted);cursor:pointer}
.skip-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.empty{text-align:center;padding:40px 10px}
.empty h2{margin:0 0 8px;font-size:20px}
.empty p{color:var(--muted);margin:0 0 18px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
ol.howto{text-align:left;color:var(--muted);font-size:14px;padding-left:20px;margin:18px auto 0;max-width:420px}
pre.report{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;font:14px/1.45 ui-monospace,"SF Mono",Menlo,monospace;margin:0}
.dock{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dock .what{flex:1;min-width:0}
.dock .what .addr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.dock .what .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.open{display:flex}
.modal .sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.hidden{display:none!important}
.peek{font-size:13px;color:var(--muted);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#mapWrap{position:relative;margin-bottom:10px}
#map{height:calc(100dvh - 330px);min-height:360px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:var(--line)}
.map-tools{position:absolute;right:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:8px}
.map-tools .btn{box-shadow:0 2px 8px rgba(0,0,0,.15)}
.map-banner{position:absolute;left:10px;right:70px;top:10px;z-index:500;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);background:#fff}
.pin span{transform:rotate(45deg);font:700 12px/1 -apple-system,sans-serif;color:#1d1b18}
.pin.todo{background:#ffffff}
.pin.next{background:#1f5f4a;width:38px;height:38px}.pin.next span{color:#fff;font-size:14px}
.pin.done{background:#7fb59c}.pin.done span{color:#fff}
.pin.ejin{background:#a3262a}.pin.ejin span{color:#fff}
.pin.skip{background:#b9b4ab;opacity:.75}
.pin.check{background:#e9a23b}
.me-dot{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35)}
.leaflet-popup-content{margin:12px 14px;font:14px/1.4 -apple-system,sans-serif;min-width:190px}
.leaflet-popup-content .addr{font-size:16px}
.leaflet-popup-content .row{margin-top:8px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 2px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}

.progress{margin:4px 0 2px;height:6px}
.sync{margin:4px 0 0}
nav.tabs{margin:10px 0 10px}
.backbar{display:flex;align-items:center;gap:12px;margin:10px 0 12px}
.backbar b{font-size:18px}
button.card{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;font:inherit;color:inherit}

body.noscroll{overflow:hidden}
.modal .sheet{max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding-top:8px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.addr.big{font-size:22px;font-weight:700;line-height:1.2}
.btn.big{width:100%;padding:15px;font-size:18px}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}

.menuitem{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:14px 4px;font:inherit;color:inherit;position:relative}
.menuitem span{font-size:22px;width:28px;text-align:center}
.menuitem .muted{font-size:13px}
.menuitem.file input{position:absolute;inset:0;opacity:0}
.map-tools .btn{width:42px;height:42px;padding:0;font-size:18px}
#map{min-height:300px}
.toast{bottom:auto;top:calc(env(safe-area-inset-top) + 64px);z-index:3100;max-width:90vw;text-align:center}
.dock{z-index:1100}
.modal{z-index:3000}
#mapWrap{z-index:0;isolation:isolate}
.pin.unsure{border:2px dashed #e9a23b}
.topbar{display:flex;gap:8px;align-items:center;margin:10px 0}
.topbar nav.tabs{flex:1;margin:0}
.topbar .iconbtn{height:46px;width:46px}
.invisible{visibility:hidden}
body{padding-top:calc(env(safe-area-inset-top) + 2px)}
.dinfo{font-size:14px;line-height:1.35;margin-top:6px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dock .chips{gap:6px}
</style>

<body>
<div class="wrap">
  <div class="hidden" aria-hidden="true"><span id="title"></span><span id="subtitle"></span><i id="bar"></i></div>
  <div class="topbar" id="topbar">
    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="map" aria-selected="true">Karta</button>
      <button role="tab" data-tab="route" aria-selected="false">Rutt</button>
    </nav>
    <button class="iconbtn" data-act="menu" aria-label="Meny">☰</button>
  </div>
  <div class="backbar hidden" id="backbar"><button class="btn small" data-tab="map">‹ Tillbaka</button><b id="backTitle"></b></div>
  <div id="mapWrap" class="hidden">
    <div id="map"></div>
    <div class="map-banner hidden" id="mapBanner"></div>
    <div class="map-tools">
      <button class="btn small" id="btnMe" aria-label="Min position">◎</button>
      <button class="btn small" id="btnFit" aria-label="Visa hela rutten">⤢</button>
    </div>
  </div>
  <main id="view"></main>
</div>
<div class="dock hidden" id="dock"><div class="in" id="dockInner"></div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
// Shared parser: takes array of pages, each array of {str,x,y,w}; returns {meta, items}
function isGroupStart(t){const i=t.indexOf(': ');if(i<0)return false;const b=t.slice(0,i);return b.length<45&&/\d/.test(b)&&!/^(Dörrkod|Använd|Kod)/i.test(b);}
function streetOf(a){return a.replace(/\s+\d+.*$/,'').trim().toLowerCase();}
function parseRouteItems(pages){
  const lines=[];
  pages.forEach((items,pi)=>{
    const its=items.filter(i=>i.str.trim()).sort((a,b)=>b.y-a.y||a.x-b.x);
    const pl=[];
    for(const it of its){
      let ln=pl.find(l=>Math.abs(l.y-it.y)<=4);
      if(!ln){ln={y:it.y,page:pi,items:[]};pl.push(ln);}
      ln.items.push(it);
    }
    pl.sort((a,b)=>b.y-a.y);
    lines.push(...pl);
  });
  const join=arr=>{arr.sort((a,b)=>a.x-b.x);let s='',end=null;for(const it of arr){if(end!==null&&it.x-end>1.5&&!s.endsWith(' ')&&!it.str.startsWith(' '))s+=' ';s+=it.str;end=it.x+it.w;}return s.replace(/\s+/g,' ').trim();};
  const meta={};const items=[];let cur=null;let pendingGroup=[];
  for(const ln of lines){
    const left=ln.items.filter(i=>i.x<110&&/^\d+$/.test(i.str.trim()));
    const right=ln.items.filter(i=>i.x>440&&/^\d+$/.test(i.str.trim()));
    const mid=ln.items.filter(i=>!left.includes(i)&&!right.includes(i));
    const text=join(mid);
    if(left.length&&mid.length){
      cur={hh:parseInt(left[0].str,10),order:right.length?parseInt(right[0].str,10):null,address:text,codes:[],tags:[],fbox:false,notes:[],group:pendingGroup.join(' ')};
      pendingGroup=[];items.push(cur);continue;
    }
    if(!text)continue;
    let m;
    if((m=text.match(/^Distrikt\s+(.+)$/)))meta.district=m[1];
    else if((m=text.match(/^Adresser på distriktet:\s*(\d+)/)))meta.total=+m[1];
    else if((m=text.match(/^Adresser som ska delas ut:\s*(\d+)/)))meta.toDeliver=+m[1];
    else if((m=text.match(/Period\s+(\d+)/))){meta.period=m[1];meta.date=text;}
    else if(/^(ANTAL|HUSH|KATEGORI|ADRESS|GÅNGORDNING)/.test(text)||/^ANTAL/.test(text)){}
    else if(pendingGroup.length||isGroupStart(text)||(!cur)){pendingGroup.push(text);}
    else if((m=text.match(/^Dörrkod:\s*(.+)$/)))cur.codes.push(m[1]);
    else if((m=text.match(/^Använd nyckelbricka:\s*(.+)$/)))cur.tags.push(m[1]);
    else if(/^Fastighetsbox$/.test(text))cur.fbox=true;
    else cur.notes.push(text);
  }
  if(pendingGroup.length&&cur)cur.notes.push(pendingGroup.join(' '));
  // spread group notes to following addresses on the same street whose number is named in the label
  for(let k=0;k<items.length;k++){const g=items[k].group;if(!g)continue;const label=g.slice(0,g.indexOf(': ')>0?g.indexOf(': '):g.length);const nums=(label.match(/\d+/g)||[]);
    for(let j=k+1;j<items.length&&!items[j].group;j++){const a=items[j].address;const n=(a.match(/\s(\d+)/)||[])[1];if(label.toLowerCase().includes(streetOf(a))&&nums.includes(n))items[j].group=g;else break;}}
  // merge wrapped note lines: join consecutive into one string
  for(const it of items){it.notes=[it.notes.join(' ').replace(/\s+/g,' ').trim()].filter(Boolean);}
  return {meta,items};
}
// Plockar ut den svenska delen ur arbetsgivarens tvåspråkiga anteckningar.
const EN_WORDS=new Set('the to at use door gate enter yard yardside box boxes behind floor only your on in copies put keep marked elevator don dont miss distribution code left right arch street distance some second first third fourth fifth postboxes letterslit open until untill with between works for inner private digit press parking house corner entrance entrences side plank outside furth throu then walk you ll have is are stop stops bike stand wall not one look accessnotes from of and it straight forward reaches common passage adresses addresses too keytag when'.split(' '));
const SV_WORDS=new Set('och till på i med vid gå in ut gården grind koden kod porten dörr dörren inkast lägg ex låda bakom vån hissen bara inte som är för har du finns längst vägen valvet höger vänster märkt genom ej dela öppen öppet brickan går också inre trappa bredvid infart bilar använd koddosan postboxar våning rakt fram endast se ovanpå parkeringshuset ingång hörnet välj en bit från brevinkast brevlåda innanför planket bron tomtgräns den gånggrind'.split(' '));
function score(t){const w=(t.toLowerCase().match(/[a-zåäö]+/g)||[]);let en=0,sv=0;
  for(const x of w){if(/[åäö]/.test(x)||SV_WORDS.has(x))sv++;else if(EN_WORDS.has(x))en++;}return {en,sv};}
const isEnglish=t=>{const s=score(t);return s.en>s.sv&&s.en>=1;};
function svText(s){
  if(!s)return '';
  const sentences=s.replace(/\s+/g,' ').split(/(?<=[.!?])\s*(?=\S)|\s+(?=(?:The|Enter|Use|Put|Keep|Only|Postboxes|Above|Code|Look|Behind|Box|Boxes|Door|Gate|Yardside|Entrance|Entrences|In the|Don't)\b)/);
  const out=[],seen=new Set();
  for(const sen of sentences){
    const parts=sen.split('/').map(x=>x.trim()).filter(Boolean);
    const anyEn=parts.some(isEnglish);const keep=[];
    parts.forEach((x,i)=>{
      if(isEnglish(x)){ // svensk mening som slutar på "till"/"med" fick sitt värde i den engelska delen (t.ex. "Öppet till / Open until 14:00")
        const prev=keep[keep.length-1];const m=x.match(/(\d{1,2}[:.]\d{2}|\d+\s?[A-ZÅÄÖ]{0,3})\.?$/);
        if(prev&&m&&/\b(till|med|vid|kl\.?)$/i.test(prev.t))prev.t+=' '+m[1];
        return;}
      if(anyEn&&score(x).sv===0)return; // neutral rest (t.ex. ett gatunamn) i en engelsk mening
      keep.push({t:x});});
    const txt=keep.map(k=>k.t).join(' / ');const norm=txt.toLowerCase().replace(/[.\s]+$/,'');
    if(txt&&!seen.has(norm)){seen.add(norm);out.push(txt);}}
  return out.join(' ').replace(/\s+([.,])/g,'$1').trim();}
function stripLabel(g){const i=g.indexOf(': ');return i>0&&i<45&&/\d/.test(g.slice(0,i))?g.slice(i+2):g;}

</script>
<script type="module">
// ======================= Utdelningsrutt =======================
const LS='utdelning.v2';
const CHECK_EVERY=8; // kontrollrunda: veckor mellan besök hos hus där ingen vill ha reklam
const PROBLEMS={kod:'Koden fungerar inte',tagg:'Taggen fungerar inte',last:'Låst / grind stängd',saknas:'Kod saknas',annat:'Annat problem'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf=a=>a.toLowerCase().replace(/\s+/g,' ').trim();
const missing=c=>/\?{2,}/.test(c);
const idOf=k=>'c-'+k.replace(/[^a-z0-9åäö]/g,'_');

function blank(){return {v:2,updatedAt:0,city:'Linköping',route:null,houses:{},week:{period:null,no:0,done:{}},showAll:false,geo:{},sync:{url:'',queue:{},last:0}};}
let S=blank();
function load(){try{const j=localStorage.getItem(LS);if(j)S=Object.assign(blank(),JSON.parse(j));}catch(e){}}
function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){toast('Kunde inte spara i telefonen');}}
let tab='map',open=null,sheetKey=null;

// ---------- modell ----------
const items=()=>S.route?S.route.items.slice().sort((a,b)=>(a.order??0)-(b.order??0)):[];
const H=it=>S.houses[keyOf(it.address)]||(S.houses[keyOf(it.address)]={});
const hOf=it=>S.houses[keyOf(it.address)]||{};
const status=it=>S.week.done[keyOf(it.address)]||null;
const nrOf=it=>items().indexOf(it)+1;
function want(it){const h=hOf(it);return h.vill==null?it.hh:Math.min(h.vill,it.hh);}
function checkDue(it){const h=hOf(it);return h.vill===0&&(h.hhChanged||(S.week.no-(h.zeroSince??S.week.no))>=CHECK_EVERY);}
function skipReason(it){
  if(status(it))return null;
  const h=hOf(it);
  if(h.vill===0&&!checkDue(it))return 'Ingen vill ha reklam';
  if(h.access&&!h.newCode)return 'Kom inte in: '+PROBLEMS[h.access].toLowerCase();
  return null;}
const active=()=>items().filter(i=>S.showAll||!skipReason(i));
const nextItem=()=>active().find(i=>!status(i));
function setVill(it,v){const h=H(it);v=Math.max(0,Math.min(it.hh,v));if(v===0&&h.vill!==0)h.zeroSince=S.week.no;if(v===0&&checkDue(it))h.zeroSince=S.week.no;h.vill=v;delete h.hhChanged;}
function markDone(it){const k=keyOf(it.address),h=H(it);S.week.done[k]='klar';delete h.access;delete h.newCode;delete h.hhChanged;if(h.vill===0)h.zeroSince=S.week.no;}
const mapsURL=it=>{const p=posOf(it);return p?`https://maps.apple.com/?daddr=${p[0]},${p[1]}&dirflg=w`:'https://maps.apple.com/?daddr='+encodeURIComponent(it.address+', '+S.city)+'&dirflg=w';};

// ---------- gemensamma bitar ----------
function chipsHTML(it){let c='';
  for(const k of it.codes){const mm=k.match(/^(Grind|Port);\s*(.+)$/);const lbl=mm?mm[1]:'Kod',val=mm?mm[2]:k;c+=`<span class="chip${missing(val)?' miss':''}"><small>${lbl}</small>${missing(val)?'saknas':esc(val)}</span>`;}
  for(const t of it.tags)c+=`<span class="chip"><small>Tagg</small>${esc(t)}</span>`;
  if(it.fbox)c+=`<span class="chip plain">Fastighetsbox</span>`;
  return c?`<div class="chips">${c}</div>`:'';}
function flagsHTML(it){const h=hOf(it),st=status(it);let f='';
  if(h.newCode)f+=`<span class="flag ok">Ny kod i listan – testa igen</span>`;
  if(h.access)f+=`<span class="flag bad">${esc(PROBLEMS[h.access])}</span>`;
  if(checkDue(it)&&!st)f+=`<span class="flag warn">${h.hhChanged?'Antal hushåll ändrat – ':''}Kontrollera om någon vill ha</span>`;
  else if(h.hhChanged)f+=`<span class="flag warn">Antal hushåll ändrat – kolla igen</span>`;
  if(st==='ejin')f+=`<span class="flag bad">Kom inte in i dag</span>`;
  if(skipReason(it)&&S.showAll)f+=`<span class="flag warn">Hoppas över i smart rutt</span>`;
  if(S.route&&S.geoDone&&!posOf(it))f+=`<span class="flag warn">Saknar plats på kartan</span>`;
  else if(isUnsure(it))f+=`<span class="flag warn">Osäker plats på kartan – flytta nålen om den är fel</span>`;
  return f?`<div class="flags">${f}</div>`:'';}
function infoParts(it){const g=it.group?svText(stripLabel(it.group)):'',n=svText(it.notes.join(' '));
  return {g:g&&!(n&&n.includes(g))?g:'',n};}
function infoText(it){const p=infoParts(it);return [p.g,p.n].filter(Boolean).join(' ');}
const wantLine=it=>{const h=hOf(it);return `${it.hh} hushåll · <span class="give">ge ut ${want(it)} ex</span>${h.vill==null?' <span class="muted">(ej rapporterat)</span>':''}`;};

// ---------- render ----------
function render(){
  const all=items(),act=active(),m=S.route&&S.route.meta||{},has=!!S.route;
  $('#title').textContent=m.district?'Distrikt '+m.district:'Utdelningsrutt';
  const doneN=act.filter(status).length;
  const ex=act.filter(i=>status(i)==='klar').reduce((s,i)=>s+want(i),0),exTot=act.reduce((s,i)=>s+want(i),0);
  const skipN=all.filter(skipReason).length;
  $('#subtitle').textContent=has?`${doneN} av ${act.length} hus · ${ex} av ${exTot} ex`+(skipN?` · ${skipN} hoppas över`:''):'Ingen adresslista inläst';
  $('#bar').style.width=act.length?(100*doneN/act.length)+'%':'0';
  const main=tab==='map'||tab==='route';
  $('#tabs').classList.toggle('invisible',!has);$('#topbar').classList.toggle('hidden',!main);
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  $('#backbar').classList.toggle('hidden',main);
  $('#backTitle').textContent=tab==='report'?'Rapport':tab==='setup'?'Inställningar':'';
  const showMap=has&&tab==='map';
  $('#mapWrap').classList.toggle('hidden',!showMap);
  const v=$('#view');
  if(!has&&main){v.innerHTML=emptyHTML();dock(null);return;}
  if(tab==='route')v.innerHTML=routeHTML(all,act);
  else if(tab==='map')v.innerHTML='';
  else if(tab==='report')v.innerHTML=reportHTML();
  else v.innerHTML=setupHTML();
  dock(main?nextItem():null);
  if(showMap){sizeMap();drawMap();}
  if(sheetKey)refreshSheet();
  syncUI();
}
function emptyHTML(){return `<div class="empty"><h2>Läs in veckans adresslista</h2><p>Välj PDF:en från utdelare.nu. Listan läses direkt i telefonen – portkoderna skickas ingenstans.</p>
  <label class="btn primary file">Välj PDF…<input type="file" accept="application/pdf,.pdf" data-file></label>
  <ol class="howto"><li>Logga in på utdelare.nu och öppna adresslistan.</li><li>Tryck på dela-knappen → <b>Spara i Filer</b>.</li><li>Kom tillbaka hit och välj filen.</li></ol></div>`;}
function cardHTML(it,isNext){
  const k=keyOf(it.address),st=status(it);
  return `<button class="card${st?' done':''}${isNext?' next':''}" id="${idOf(k)}" data-act="house" data-k="${esc(k)}">
      <div class="ord">${st==='klar'?'✓':nrOf(it)}</div>
      <div class="cbody"><div class="addr">${esc(it.address)}</div>
        <div class="meta">${wantLine(it)}</div>
        ${chipsHTML(it)}${flagsHTML(it)}
        ${infoText(it)?`<div class="peek">📍 ${esc(infoText(it))}</div>`:''}</div>
    </button>`;}
function routeHTML(all,act){
  const nx=nextItem(),remaining=act.filter(i=>!status(i));
  let h='';
  if(!act.length)h+=`<div class="empty"><p>Alla adresser hoppas över. Slå av Smart rutt i menyn för att se dem.</p></div>`;
  h+=act.map(i=>cardHTML(i,nx&&i===nx)).join('');
  if(!S.showAll){const sk=all.filter(skipReason);
    if(sk.length)h+=`<details class="skipped"><summary>Hoppas över (${sk.length})</summary>${sk.map(i=>`<div class="skip-item"><div><b>${esc(i.address)}</b><div class="muted">${esc(skipReason(i))}</div></div><button class="btn small" data-act="unskip" data-k="${esc(keyOf(i.address))}">Ta med</button></div>`).join('')}</details>`;}
  if(!remaining.length&&act.length)h+=doneHTML();
  return h;}
const doneHTML=()=>`<div class="empty"><h2>Klart för i dag! 🎉</h2><p>Rapporten till arbetsgivaren finns i menyn.</p><button class="btn primary" data-go="report">Visa rapport</button></div>`;
function reportHTML(){if(!S.route)return `<div class="empty"><p>Ingen adresslista inläst.</p></div>`;
  return `<div class="toolbar"><button class="btn primary" data-act="copy">Kopiera rapport</button><button class="btn" data-act="savefile">Spara som fil</button></div>
  <p class="muted" style="font-size:14px;margin:0 0 10px">Kopiera och klistra in i ett mejl eller sms till arbetsgivaren.</p><pre class="report" id="reportText">${esc(reportText())}</pre>`;}
function setupHTML(){const m=S.route&&S.route.meta;const miss=S.route?items().filter(i=>!posOf(i)).length:0;
  return `<div class="section-title">Adresslista</div><div class="card static"><div class="body">
    ${m?`<div><b>Distrikt ${esc(m.district||'')}</b> · period ${esc(m.period||'')}</div><div class="muted" style="font-size:14px">${S.route.items.length} adresser · inläst ${new Date(S.route.importedAt).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'})}${miss?` · ${miss} saknar plats på kartan`:''}</div>`:'<div class="muted">Ingen lista inläst ännu.</div>'}
    <div class="row"><label class="btn primary file">Läs in ny vecka (PDF)…<input type="file" accept="application/pdf,.pdf" data-file></label></div>
    <p class="muted" style="font-size:13px;margin:10px 0 0">Det hon rapporterat (vill ha reklam, problem med kod) sparas mellan veckorna. En ny period nollställer bara bockarna. Byts koden i listan för ett hus med kodproblem tas huset med igen och märks ”Ny kod”. Hus där ingen vill ha reklam tas med för kontroll var ${CHECK_EVERY}:e vecka, eller direkt om antalet hushåll ändras i listan.</p>
  </div></div>
  <div class="section-title">Kalkylark</div><div class="card static"><div class="body">
    <div class="sync hidden" id="syncStatus" style="margin:0 0 8px;font-size:14px"></div>
    <label class="lbl" style="margin-top:0">Skriptets webbappslänk (slutar på /exec)</label>
    <input type="text" data-syncurl value="${esc(S.sync.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row"><button class="btn" data-act="synctest">Testa kopplingen</button><button class="btn" data-act="syncall">Skicka allt igen</button></div>
    <div class="row"><button class="btn" data-act="syncpull">Hämta från kalkylarket</button></div>
    <p class="muted" style="font-size:13px;margin:10px 0 0">Varje gång hon rapporterar något skickas huset till kalkylarket (en rad per hus och vecka). Utan täckning sparas det i telefonen och skickas när nätet är tillbaka. ”Hämta från kalkylarket” används på en ny telefon. Portkoder skickas aldrig.</p>
  </div></div>
  <div class="section-title">Rutt och karta</div><div class="card static"><div class="body">
    <label class="toggle"><input type="checkbox" data-act="smart" ${S.showAll?'':'checked'}> Smart rutt (hoppa över hus utan reklam)</label>
    <label class="lbl">Ort (för adressökning)</label><input type="text" data-city value="${esc(S.city)}">
    <div class="row"><button class="btn" data-act="regeo">Sök adresserna på kartan igen</button></div>
    <div class="row"><button class="btn" data-act="resetweek">Nollställ veckans bockar</button></div>
  </div></div>
  <div class="section-title">Säkerhetskopia</div><div class="card static"><div class="body">
    <p class="muted" style="font-size:14px;margin:0 0 8px">Allt sparas i telefonens webbläsare${S.sync.url?' och i kalkylarket':''}. Kopiera en säkerhetskopia ibland och spara i Anteckningar.</p>
    <div class="row"><button class="btn" data-act="backup">Kopiera säkerhetskopia</button><button class="btn" data-act="restore">Återställ…</button></div>
    <div class="row"><button class="btn warn" data-act="wipe">Radera allt</button></div>
  </div></div>`;}
function dock(it){const d=$('#dock');
  if(!it){d.classList.add('hidden');document.body.classList.remove('has-dock');
    if(S.route&&(tab==='map')&&active().length&&!active().some(i=>!status(i))){d.classList.remove('hidden');document.body.classList.add('has-dock');$('#dockInner').innerHTML=`<div class="what"><div class="addr">Klart för i dag! 🎉</div><div class="meta">Rapporten finns i menyn ☰</div></div><div class="dbtns"><button class="btn primary" data-go="report">Visa rapport</button></div>`;}
    return;}
  d.classList.remove('hidden');document.body.classList.add('has-dock');
  const k=keyOf(it.address);
  $('#dockInner').innerHTML=`<button class="what" data-act="house" data-k="${esc(k)}">
      <div class="meta">Nästa · nr ${nrOf(it)} · ${wantLine(it)}</div>
      <div class="addr">${esc(it.address)}</div>${chipsHTML(it)}${infoText(it)?`<div class="dinfo">📍 ${esc(infoText(it))}</div>`:''}</button>
    <div class="dbtns"><button class="btn" data-act="house" data-k="${esc(k)}">Rapportera</button><button class="btn primary" data-act="done" data-k="${esc(k)}">Klar ✓</button></div>`;}

// ---------- husbladet (öppnas över kartan) ----------
function houseHTML(it){
  const k=keyOf(it.address),h=hOf(it),st=status(it),v=h.vill??Math.min(1,it.hh);
  return `<div class="grab"></div>
    <div class="sheet-head"><div><div class="meta">nr ${nrOf(it)}</div><div class="addr big">${esc(it.address)}</div><div class="meta">${wantLine(it)}</div></div>
      <button class="iconbtn" data-act="close" aria-label="Stäng">✕</button></div>
    ${chipsHTML(it)}${flagsHTML(it)}
    ${(()=>{const p=infoParts(it);return (p.g?`<div class="note">📍 ${esc(p.g)}</div>`:'')+(p.n?`<div class="note plain">${esc(p.n)}</div>`:'');})()}
    <label class="lbl">Hur många av ${it.hh} hushåll vill ha reklam?</label>
    <div class="stepper"><button data-act="v-" data-k="${esc(k)}" aria-label="Minska">−</button><output>${v}</output><button data-act="v+" data-k="${esc(k)}" aria-label="Öka">+</button>
      <span class="muted" style="font-size:13px">${h.vill==null?'inte sparat än':''}</span></div>
    <div class="opts"><button class="opt" aria-pressed="${h.vill===0}" data-act="v0" data-k="${esc(k)}">Ingen</button>${[1,2].filter(n=>n<it.hh).map(n=>`<button class="opt good" aria-pressed="${h.vill===n}" data-act="vn" data-n="${n}" data-k="${esc(k)}">${n}</button>`).join('')}<button class="opt good" aria-pressed="${h.vill===it.hh}" data-act="vall" data-k="${esc(k)}">Alla ${it.hh}</button></div>
    <div class="row"><button class="btn primary big" data-act="done" data-k="${esc(k)}">${st==='klar'?'Ångra klar':'Klar ✓'}</button></div>
    <div class="row"><button class="btn warn" data-act="noentry" data-k="${esc(k)}">Kom inte in</button><a class="btn" href="${mapsURL(it)}" target="_blank" rel="noopener">Vägbeskrivning</a></div>
    <details class="more"${h.access||h.note||st==='ejin'?' open':''}><summary>Problem och anteckning</summary>
      <div class="opts">${Object.entries(PROBLEMS).map(([p,t])=>`<button class="opt" aria-pressed="${h.access===p}" data-act="prob" data-p="${p}" data-k="${esc(k)}">${t}</button>`).join('')}
        ${h.access?`<button class="opt good" aria-pressed="true" data-act="probclear" data-k="${esc(k)}">Fungerar nu</button>`:''}</div>
      <label class="lbl">Anteckning (kommer med i rapporten)</label>
      <textarea data-note="${esc(k)}" placeholder="t.ex. ny kod står på dörren, porten öppen till 16">${esc(h.note||'')}</textarea>
      <div class="row"><button class="btn small" data-act="move" data-k="${esc(k)}">Flytta nålen på kartan</button></div>
    </details>`;}
function openHouse(k){sheetKey=k;const it=byKey(k);if(!it)return;$('#sheet').innerHTML=houseHTML(it);$('#sheet').scrollTop=0;$('#modal').classList.add('open');document.body.classList.add('noscroll');}
function refreshSheet(){const it=byKey(sheetKey);if(!it){closeModal();return;}const sc=$('#sheet').scrollTop;const ta=document.activeElement&&document.activeElement.matches('[data-note]');if(ta)return;$('#sheet').innerHTML=houseHTML(it);$('#sheet').scrollTop=sc;}
function menuHTML(){return `<div class="grab"></div><div class="sheet-head"><div class="addr big">Meny</div><button class="iconbtn" data-act="close" aria-label="Stäng">✕</button></div>
  <label class="menuitem file"><span>📄</span><div><b>Läs in ny vecka</b><div class="muted">Välj adresslistan (PDF)</div></div><input type="file" accept="application/pdf,.pdf" data-file></label>
  <button class="menuitem" data-go="report"><span>📋</span><div><b>Rapport till arbetsgivaren</b><div class="muted">Kodproblem och hur många som vill ha reklam</div></div></button>
  <button class="menuitem" data-go="setup"><span>⚙︎</span><div><b>Inställningar</b><div class="muted">Kalkylark, smart rutt, säkerhetskopia</div></div></button>`;}

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}
function modal(html){sheetKey=null;$('#sheet').innerHTML=html;$('#modal').classList.add('open');document.body.classList.add('noscroll');}
function closeModal(){sheetKey=null;$('#modal').classList.remove('open');document.body.classList.remove('noscroll');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

// ======================= KARTA =======================
let map=null,layer=null,me=null,meAcc=null,watchId=null,fitted=false,moveKey=null,lastMe=null;
function rawPos(it){const h=hOf(it);if(h.pos)return {p:h.pos,manual:true};const g=S.geo[geoKey(it.address)];return g?{p:g}:null;}
function dist(a,b){const r=Math.PI/180,dy=(b[0]-a[0])*r,dx=(b[1]-a[1])*r*Math.cos(a[0]*r);return 6371000*Math.hypot(dx,dy);}
// Adressökningen kan placera ett hus fel (t.ex. på fel del av gatan). Ett hus som ligger långt från
// både grannarna i gångordningen och resten av distriktet markeras som osäkert och placeras mellan grannarna.
let _unsure=null,_unsureKey='';
function unsure(){
  const key=S.updatedAt+'|'+(S.route&&S.route.importedAt);if(_unsure&&_unsureKey===key)return _unsure;
  _unsureKey=key;_unsure={};if(!S.route)return _unsure;
  const its=items(),raw=its.map(rawPos),pts=raw.filter(Boolean).map(r=>r.p);if(pts.length<5)return _unsure;
  const md=a=>{const s=a.slice().sort((x,y)=>x-y);return s[Math.floor(s.length/2)];};
  const med=[md(pts.map(q=>q[0])),md(pts.map(q=>q[1]))];
  const bad=new Set();
  its.forEach((it,i)=>{const r=raw[i];if(!r||r.manual)return;
    let prev=null,next=null;for(let j=i-1;j>=0;j--)if(raw[j]){prev=raw[j].p;break;}for(let j=i+1;j<its.length;j++)if(raw[j]){next=raw[j].p;break;}
    const nb=[prev,next].filter(Boolean),dN=nb.length?Math.min(...nb.map(q=>dist(r.p,q))):0,dM=dist(r.p,med);
    if(dM>800||(nb.length&&dN>300&&dM>250))bad.add(i);});
  its.forEach((it,i)=>{if(!bad.has(i))return;
    let prev=null,next=null;for(let j=i-1;j>=0;j--)if(raw[j]&&!bad.has(j)){prev=raw[j].p;break;}for(let j=i+1;j<its.length;j++)if(raw[j]&&!bad.has(j)){next=raw[j].p;break;}
    const p=prev&&next?[(prev[0]+next[0])/2,(prev[1]+next[1])/2]:(prev||next);
    if(p)_unsure[keyOf(it.address)]=[+p[0].toFixed(6),+p[1].toFixed(6)];});
  return _unsure;}
function posOf(it){const r=rawPos(it);if(!r)return null;if(r.manual)return r.p;const u=unsure()[keyOf(it.address)];return u||r.p;}
const isUnsure=it=>!!unsure()[keyOf(it.address)];
function geoKey(a){return keyOf(a)+'|'+keyOf(S.city);}
function sizeMap(){const el=$('#map');if(!el)return;const top=el.getBoundingClientRect().top+scrollY;const dockH=document.body.classList.contains('has-dock')?$('#dock').offsetHeight:0;
  el.style.height=Math.max(300,innerHeight-top-dockH-10)+'px';if(map)map.invalidateSize();}
addEventListener('resize',()=>{if(tab==='map')sizeMap();});
function ensureMap(){
  if(map)return true;
  if(!window.L){$('#mapBanner').textContent='Kartan kunde inte laddas – kontrollera internet.';$('#mapBanner').classList.remove('hidden');return false;}
  map=L.map('map',{zoomControl:false}).setView([58.4108,15.6214],15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  layer=L.layerGroup().addTo(map);
  map.on('click',e=>{if(!moveKey)return;const h=S.houses[moveKey]||(S.houses[moveKey]={});h.pos=[+e.latlng.lat.toFixed(6),+e.latlng.lng.toFixed(6)];moveKey=null;save();banner();drawMap();toast('Nålen är flyttad');});
  startGPS();
  return true;}
function pinState(it,isNext){const st=status(it);if(st==='klar')return 'done';if(st==='ejin')return 'ejin';if(isNext)return 'next';if(skipReason(it))return 'skip';if(checkDue(it))return 'check';return 'todo';}
function drawMap(){
  if(!ensureMap())return;
  setTimeout(()=>map.invalidateSize(),50);
  layer.clearLayers();
  const all=items(),nx=nextItem(),seen={},pts=[],route=[];
  all.forEach((it,i)=>{let p=posOf(it);if(!p)return;
    const sk=p[0].toFixed(5)+','+p[1].toFixed(5);const n=seen[sk]=(seen[sk]||0)+1;
    if(n>1){const a=(n-1)*1.9,r=0.00006;p=[p[0]+r*Math.cos(a),p[1]+r*Math.sin(a)*1.9];}
    const state=pinState(it,it===nx);
    const icon=L.divIcon({className:'',html:`<div class="pin ${state}${isUnsure(it)?' unsure':''}"><span>${state==='done'?'✓':i+1}</span></div>`,iconSize:state==='next'?[38,38]:[30,30],iconAnchor:state==='next'?[19,38]:[15,30]});
    const mk=L.marker(p,{icon,zIndexOffset:state==='next'?1000:(state==='skip'||state==='done'?-100:0)}).addTo(layer);
    mk.on('click',()=>{if(moveKey)return;openHouse(keyOf(it.address));});
    pts.push(p);
    if(!status(it)&&!skipReason(it))route.push(p);});
  if(nx&&posOf(nx)&&lastMe)route.unshift(lastMe);
  if(route.length>1)L.polyline(route,{color:'#1f5f4a',weight:4,opacity:.75,dashArray:'6 8',interactive:false}).addTo(layer);
  if(!fitted&&pts.length){map.fitBounds(pts,{padding:[30,30]});fitted=true;}
  banner();}
function panToNext(){const n=nextItem();if(n&&map&&posOf(n))map.panTo(posOf(n),{animate:true});}
let bannerHidden=false;
function banner(){const b=$('#mapBanner');let t='';
  if(moveKey)t='Tryck på kartan där <b>'+esc(byKey(moveKey)?.address||'')+'</b> ligger. <a href="#" data-act="movecancel">Avbryt</a>';
  else if(geoBusy)t=`Hittar adresserna på kartan… ${geoBusy.done} av ${geoBusy.total}`;
  else if(S.route){const miss=items().filter(i=>!posOf(i)),un=items().filter(isUnsure);
    if(miss.length)t=`${miss.length} ${miss.length===1?'adress':'adresser'} hittades inte. Öppna dem i Rutt → <i>Flytta nålen på kartan</i>.`;
    else if(un.length)t=`${un.map(i=>'nr '+nrOf(i)).join(', ')}: osäker plats, placerad mellan grannarna i rutten. Tryck på nålen → <i>Flytta nålen</i> om den är fel. <a href="#" data-act="bannerok">OK</a>`;}
  if(bannerHidden&&!moveKey&&!geoBusy)t='';
  b.innerHTML=t;b.classList.toggle('hidden',!t);}
function startGPS(){
  if(!navigator.geolocation||watchId!==null)return;
  watchId=navigator.geolocation.watchPosition(p=>{
    lastMe=[p.coords.latitude,p.coords.longitude];
    if(!me){me=L.marker(lastMe,{icon:L.divIcon({className:'',html:'<div class="me-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:2000,interactive:false}).addTo(map);
      meAcc=L.circle(lastMe,{radius:p.coords.accuracy,color:'#1a73e8',weight:1,fillOpacity:.08,interactive:false}).addTo(map);}
    else{me.setLatLng(lastMe);meAcc.setLatLng(lastMe).setRadius(p.coords.accuracy);}
  },err=>{if(err.code===1)toast('Tillåt platsåtkomst i Safari för att se din position');},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});}
$('#btnMe').addEventListener('click',()=>{if(lastMe&&map)map.setView(lastMe,18);else{startGPS();toast('Söker din position…');}});
$('#btnFit').addEventListener('click',()=>{if(!map)return;const pts=items().map(posOf).filter(Boolean);if(pts.length)map.fitBounds(pts,{padding:[30,30]});});

function reportText(){
  const m=S.route.meta||{},all=items(),act=active(),done=act.filter(i=>status(i)==='klar');
  let t=`Rapport distrikt ${m.district||''}${m.period?', period '+m.period:''}\n${m.date||''}\n\nUtdelat: ${done.length} av ${act.length} adresser, ${done.reduce((s,i)=>s+want(i),0)} ex.\n`;
  const probs=all.filter(i=>hOf(i).access||status(i)==='ejin'||(i.codes.some(missing)&&status(i)!=='klar'));
  t+=`\nÅTKOMSTPROBLEM (${probs.length})\n`+(probs.length?'':'Inga.\n');
  for(const i of probs){const h=hOf(i);const what=h.access?PROBLEMS[h.access]:(i.codes.some(missing)?'Kod saknas i listan':'Kom inte in');
    const cur=[...i.codes.filter(c=>!missing(c)).map(c=>'kod '+c),...i.tags.map(x=>'tagg '+x)].join(', ');
    t+=`- ${i.address}: ${what}${cur?' (i listan: '+cur+')':''}${h.note?'. '+h.note:''}\n`;}
  const rep=all.filter(i=>hOf(i).vill!=null&&hOf(i).vill<i.hh);
  const sumH=all.reduce((s,i)=>s+i.hh,0),sumW=all.reduce((s,i)=>s+want(i),0);
  t+=`\nVILL HA REKLAM\nBehov: ${sumW} ex av ${sumH} hushåll i distriktet.\n`;
  for(const i of rep)t+=`- ${i.address}: ${hOf(i).vill} av ${i.hh} vill ha${hOf(i).vill===0?' (ingen)':''}\n`;
  const other=all.filter(i=>hOf(i).note&&!probs.includes(i));
  if(other.length){t+=`\nÖVRIGT\n`;for(const i of other)t+=`- ${i.address}: ${hOf(i).note}\n`;}
  return t;}
// ---------- adressökning (OpenStreetMap Nominatim, max 1 fråga/sekund) ----------
let geoBusy=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function nominatim(params){
  const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=se&'+new URLSearchParams(params);
  const r=await fetch(u,{headers:{'Accept-Language':'sv'}});if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();return j[0]?[+(+j[0].lat).toFixed(6),+(+j[0].lon).toFixed(6)]:null;}
async function geocodeOne(addr){
  const m=addr.match(/^(.*?)\s+(\d+)\s*([A-Za-zÅÄÖåäö])?$/);
  const street=m?m[1]:addr,num=m?m[2]:'',let_=m&&m[3]?m[3]:'';
  const tries=[];
  if(let_)tries.push({street:`${num}${let_} ${street}`,city:S.city});
  if(num)tries.push({street:`${num} ${street}`,city:S.city});
  tries.push({q:`${addr}, ${S.city}`});
  for(const t of tries){const k='q:'+JSON.stringify(t);
    if(k in S.geo){if(S.geo[k])return S.geo[k];continue;}
    let res=null;try{res=await nominatim(t);}catch(e){await sleep(1100);return undefined;} // nätverksfel: försök senare
    S.geo[k]=res;await sleep(1100);if(res)return res;}
  return null;}
async function geocodeAll(force){
  if(geoBusy||!S.route)return;
  const todo=items().filter(i=>force||!(geoKey(i.address) in S.geo));
  if(!todo.length){S.geoDone=true;return;}
  geoBusy={done:0,total:todo.length};banner();
  for(const it of todo){const r=await geocodeOne(it.address);if(r!==undefined)S.geo[geoKey(it.address)]=r;geoBusy.done++;save();if(tab==='map')drawMap();else banner();}
  geoBusy=null;S.geoDone=true;save();fitted=false;render();
  const miss=items().filter(i=>!posOf(i)).length;toast(miss?`${miss} ${miss===1?'adress':'adresser'} hittades inte på kartan`:'Alla adresser finns på kartan');}

// ======================= KALKYLARK =======================
function rowFor(it){const h=hOf(it),m=S.route.meta||{},st=status(it);
  return {period:m.period||'',date:m.date||'',district:m.district||'',order:items().indexOf(it)+1,address:it.address,hh:it.hh,vill:h.vill??null,
    status:st==='klar'?'Utdelat':st==='ejin'?'Kom inte in':'',problem:h.access?PROBLEMS[h.access]:'',note:h.note||'',updated:Date.now()};}
function touch(it){if(!it||!S.route){save();return;}const h=H(it);h.updated=Date.now();
  S.sync.queue[(S.route.meta.period||'')+'|'+keyOf(it.address)]=rowFor(it);save();scheduleSync();}
let syncBusy=false,syncT=null,syncErr=null;
function scheduleSync(ms=1500){clearTimeout(syncT);syncT=setTimeout(syncNow,ms);syncUI();}
async function syncNow(){
  const keys=Object.keys(S.sync.queue);
  if(syncBusy||!S.sync.url||!keys.length)return syncUI();
  if(navigator.onLine===false){syncErr='offline';return syncUI();}
  syncBusy=true;syncUI();
  const rows=keys.map(k=>S.sync.queue[k]);
  try{const r=await fetch(S.sync.url,{method:'POST',body:JSON.stringify({rows}),redirect:'follow'});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'okänt fel');
    keys.forEach((k,i)=>{if(S.sync.queue[k]&&S.sync.queue[k].updated===rows[i].updated)delete S.sync.queue[k];});
    S.sync.last=Date.now();syncErr=null;save();}
  catch(e){syncErr=String(e&&e.message||e);}
  syncBusy=false;syncUI();
  if(!syncErr&&Object.keys(S.sync.queue).length)scheduleSync(800);}
function syncUI(){const el=$('#syncStatus');if(!el)return;const n=Object.keys(S.sync.queue).length;let t='';
  if(S.sync.url){
    if(syncBusy)t='☁︎ Skickar till kalkylarket…';
    else if(!n)t='☁︎ Allt är sparat i kalkylarket';
    else if(syncErr==='offline')t=`☁︎ ${n} ${n===1?'hus väntar':'hus väntar'} – skickas när nätet är tillbaka`;
    else if(syncErr)t=`☁︎ ${n} hus väntar – kunde inte skicka, försöker igen`;
    else t=`☁︎ ${n} hus väntar på att skickas`;}
  el.textContent=t;el.classList.toggle('hidden',!t);}
async function getSync(q){const r=await fetch(S.sync.url+(q||''),{redirect:'follow'});const j=await r.json();if(!j.ok)throw new Error(j.error||'okänt fel');return j;}
async function testSync(){if(!S.sync.url){toast('Klistra in länken först');return;}
  try{const j=await getSync('?ping=1');toast(`Kopplat ✓ ${j.rows} rader i kalkylarket`);syncErr=null;scheduleSync(100);}
  catch(e){modal(`<h3 style="margin-top:0">Kunde inte nå kalkylarket</h3><p class="muted">${esc(e.message||e)}</p><p class="muted">Kontrollera att länken slutar på /exec och att webbappen är publicerad med <b>Vem har åtkomst: Alla</b>.</p><button class="btn block" data-act="close">Stäng</button>`);}}
async function pullSync(){if(!S.sync.url){toast('Klistra in länken först');return;}
  try{const j=await getSync('');const latest={};
    for(const r of j.rows){const k=keyOf(r.address);if(!latest[k]||r.updated>latest[k].updated)latest[k]=r;}
    const rev=Object.fromEntries(Object.entries(PROBLEMS).map(([a,b])=>[b,a]));let n=0;const per=S.route&&S.route.meta.period;
    for(const [k,r] of Object.entries(latest)){const h=S.houses[k]||(S.houses[k]={});if((h.updated||0)>=r.updated)continue;
      if(r.vill!=null&&!isNaN(r.vill)){h.vill=r.vill;if(r.vill===0&&h.zeroSince==null)h.zeroSince=S.week.no;}
      if(r.problem&&rev[r.problem])h.access=rev[r.problem];else delete h.access;
      h.note=r.note||'';h.updated=r.updated;
      if(per&&String(r.period)===String(per)){if(r.status==='Utdelat')S.week.done[k]='klar';else if(r.status==='Kom inte in')S.week.done[k]='ejin';}
      n++;}
    save();render();toast(n?`${n} hus uppdaterade från kalkylarket`:'Telefonen var redan uppdaterad');}
  catch(e){toast('Kunde inte hämta: '+(e.message||e));}}
addEventListener('online',()=>{syncErr=null;syncNow();});
// Är appen öppen i flera flikar: läs in det senaste som en annan flik sparat i stället för att skriva över det.
addEventListener('storage',e=>{if(e.key!==LS||!e.newValue)return;try{const o=JSON.parse(e.newValue);if((o.updatedAt||0)>=(S.updatedAt||0)){S=Object.assign(blank(),o);render();syncUI();}}catch(_){}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;try{const o=JSON.parse(localStorage.getItem(LS)||'null');if(o&&(o.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(blank(),o);render();}}catch(_){}syncUI();syncNow();});
setInterval(()=>syncNow(),60000);

// ======================= INLÄSNING =======================
let pdfjs=null;
async function loadPdfjs(){if(pdfjs)return pdfjs;const w=await import('./pdf.worker.min.js');globalThis.pdfjsWorker=w;pdfjs=await import('./pdf.min.js');return pdfjs;}
async function importPdf(file){
  toast('Läser in listan…');
  try{
    const lib=await loadPdfjs();
    const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const pages=[];
    for(let p=1;p<=doc.numPages;p++){const tc=await (await doc.getPage(p)).getTextContent();pages.push(tc.items.map(i=>({str:i.str,x:i.transform[4],y:i.transform[5],w:i.width})));}
    const r=parseRouteItems(pages);
    if(!r.items.length)throw new Error('Hittade inga adresser i filen.');
    const newPeriod=!S.route||(r.meta.period||'')!==(S.route.meta.period||'');
    if(newPeriod){S.week={period:r.meta.period||null,no:(S.week.no||0)+(S.route?1:0),done:{}};}
    let codeN=0,hhN=0;
    for(const it of r.items){const h=H(it),snap=JSON.stringify([it.codes,it.tags]);
      if(h.snap&&h.snap!==snap){h.newCode=true;codeN++;}else if(newPeriod)delete h.newCode;
      if(h.hh!=null&&h.hh!==it.hh){h.hhChanged=true;hhN++;}
      h.snap=snap;h.hh=it.hh;if(h.zeroSince==null&&h.vill===0)h.zeroSince=S.week.no;}
    S.route={meta:r.meta,items:r.items,importedAt:Date.now()};
    save();tab='map';closeModal();fitted=false;render();
    toast(`${r.items.length} adresser inlästa`+(codeN?` · ${codeN} med ny kod`:'')+(hhN?` · ${hhN} med ändrat antal hushåll`:''));
    geocodeAll(false);
  }catch(e){console.error(e);modal(`<h3 style="margin-top:0">Kunde inte läsa filen</h3><p class="muted">${esc(e.message||e)}</p><p class="muted">Kontrollera att det är adresslistan som PDF från utdelare.nu.</p><button class="btn block" data-act="close">Stäng</button>`);}
}

// ======================= HÄNDELSER =======================
const byKey=k=>items().find(i=>keyOf(i.address)===k);
function go(t){tab=t;closeModal();render();scrollTo(0,0);}
document.addEventListener('change',e=>{
  if(e.target.matches('[data-file]')&&e.target.files[0]){closeModal();importPdf(e.target.files[0]);e.target.value='';}
  if(e.target.matches('[data-act=smart]')){S.showAll=!e.target.checked;save();render();}
  if(e.target.matches('[data-city]')){S.city=e.target.value.trim()||'Linköping';save();}
  if(e.target.matches('[data-syncurl]')){const u=e.target.value.trim();S.sync.url=u;save();syncUI();
    if(u&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u))toast('Länken ska börja med https://script.google.com och sluta på /exec');else if(u)testSync();}
});
let noteT=null;
document.addEventListener('input',e=>{if(e.target.matches('[data-note]')){const k=e.target.dataset.note;const h=S.houses[k]||(S.houses[k]={});h.note=e.target.value;clearTimeout(noteT);noteT=setTimeout(()=>touch(byKey(k)),600);}});
document.addEventListener('focusout',e=>{if(e.target.matches&&e.target.matches('[data-note]')){clearTimeout(noteT);touch(byKey(e.target.dataset.note));}});
function afterChange(){render();if(sheetKey)refreshSheet();}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act],[data-tab],[data-go]');if(!t||t.matches('input'))return;
  if(t.dataset.tab){tab=t.dataset.tab;render();scrollTo(0,0);return;}
  if(t.dataset.go){go(t.dataset.go);return;}
  const a=t.dataset.act,k=t.dataset.k,it=k&&byKey(k);
  if(t.tagName==='A'&&t.getAttribute('href')==='#')e.preventDefault();
  switch(a){
    case 'house':openHouse(k);break;
    case 'done':{const was=status(it)==='klar';if(was)delete S.week.done[k];else{if(sheetKey===k&&hOf(it).vill==null)setVill(it,Math.min(1,it.hh));markDone(it);}touch(it);closeModal();render();
      if(was){toast('Ångrat');break;}
      const n=nextItem();toast(n?'Klar ✓  Nästa: '+n.address:'Klar ✓');
      if(tab==='map')panToNext();else document.getElementById(n?idOf(keyOf(n.address)):'')?.scrollIntoView({behavior:'smooth',block:'center'});break;}
    case 'noentry':{S.week.done[k]='ejin';const h=H(it);if(!h.access)h.access=it.codes.some(missing)?'saknas':(it.tags.length&&!it.codes.length?'tagg':'kod');delete h.newCode;touch(it);afterChange();
      const d=$('#sheet details.more');if(d){d.open=true;d.scrollIntoView({block:'start',behavior:'smooth'});}toast('Markerat – välj vad som var fel');break;}
    case 'v+':setVill(it,(hOf(it).vill??Math.min(1,it.hh))+1);touch(it);afterChange();break;
    case 'v-':setVill(it,(hOf(it).vill??Math.min(1,it.hh))-1);touch(it);afterChange();break;
    case 'vn':setVill(it,+t.dataset.n);touch(it);afterChange();break;
    case 'vall':setVill(it,it.hh);touch(it);afterChange();break;
    case 'v0':setVill(it,0);touch(it);afterChange();break;
    case 'prob':{const h=H(it);h.access=t.dataset.p;delete h.newCode;touch(it);afterChange();break;}
    case 'probclear':{const h=H(it);delete h.access;if(status(it)==='ejin')delete S.week.done[k];touch(it);afterChange();break;}
    case 'unskip':{const h=H(it);delete h.access;if(h.vill===0){h.zeroSince=S.week.no-CHECK_EVERY;}touch(it);render();toast('Tas med i rutten');break;}
    case 'move':closeModal();tab='map';render();moveKey=k;banner();toast('Tryck på kartan där huset ligger');break;
    case 'movecancel':moveKey=null;banner();break;
    case 'bannerok':bannerHidden=true;banner();break;
    case 'menu':modal(menuHTML());break;
    case 'copy':try{await navigator.clipboard.writeText(reportText());toast('Rapporten är kopierad');}catch(_){selectReport();toast('Markera och kopiera texten');}break;
    case 'savefile':{const m=S.route.meta||{};const url=URL.createObjectURL(new Blob([reportText()],{type:'text/plain;charset=utf-8'}));const l=document.createElement('a');l.href=url;l.download=`rapport-${m.district||'distrikt'}-${m.period||''}.txt`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);break;}
    case 'regeo':for(const key of Object.keys(S.geo))delete S.geo[key];S.geoDone=false;save();tab='map';render();geocodeAll(true);break;
    case 'resetweek':modal(`<h3 style="margin-top:0">Nollställ veckans bockar?</h3><p class="muted">Rapporterat antal som vill ha reklam och kodproblem sparas.</p><div class="row"><button class="btn" data-act="close">Avbryt</button><button class="btn primary" data-act="doresetweek">Nollställ</button></div>`);break;
    case 'doresetweek':S.week.done={};save();closeModal();render();toast('Nollställt');break;
    case 'wipe':modal(`<h3 style="margin-top:0">Radera allt?</h3><p class="muted">Listan och allt hon rapporterat i telefonen tas bort. Det går inte att ångra.</p><div class="row"><button class="btn" data-act="close">Avbryt</button><button class="btn warn" data-act="dowipe">Radera</button></div>`);break;
    case 'dowipe':{const c=S.city,sy=S.sync.url;S=blank();S.city=c;S.sync.url=sy;save();closeModal();tab='map';render();break;}
    case 'backup':try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Säkerhetskopia kopierad');}catch(_){modal(`<h3 style="margin-top:0">Säkerhetskopia</h3><textarea readonly style="min-height:160px">${esc(JSON.stringify(S))}</textarea><div class="row"><button class="btn" data-act="close">Stäng</button></div>`);}break;
    case 'restore':modal(`<h3 style="margin-top:0">Återställ säkerhetskopia</h3><textarea id="restoreTxt" style="min-height:140px" placeholder="Klistra in här"></textarea><div class="row"><button class="btn" data-act="close">Avbryt</button><button class="btn primary" data-act="dorestore">Återställ</button></div>`);break;
    case 'dorestore':try{const o=JSON.parse($('#restoreTxt').value);if(!o||typeof o!=='object'||!('houses' in o))throw 0;S=Object.assign(blank(),o);save();closeModal();fitted=false;render();toast('Återställt');}catch(_){toast('Ogiltig säkerhetskopia');}break;
    case 'synctest':testSync();break;
    case 'syncall':{if(!S.route)break;let n=0;for(const i of items()){const h=hOf(i);if(status(i)||h.vill!=null||h.access||h.note){S.sync.queue[(S.route.meta.period||'')+'|'+keyOf(i.address)]=rowFor(i);n++;}}save();toast(n?`${n} hus skickas`:'Inget rapporterat den här veckan');scheduleSync(100);break;}
    case 'syncpull':pullSync();break;
    case 'close':closeModal();break;
  }
});
function selectReport(){const el=$('#reportText');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}

load();
// Kopplingslänk: …/utdelning/#kalkylark=<webbappslänk> sparar länken och tar bort den ur adressfältet
function connectFromHash(){if(!location.hash.startsWith('#kalkylark='))return;const u=decodeURIComponent(location.hash.slice(11));
  history.replaceState(null,'',location.pathname+location.search);
  if(/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){S.sync.url=u;save();syncUI();setTimeout(testSync,300);}}
connectFromHash();addEventListener('hashchange',connectFromHash);
render();syncUI();syncNow();if(S.route)geocodeAll(false);
</script>
